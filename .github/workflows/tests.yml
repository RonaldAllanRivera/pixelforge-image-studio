name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    # Tests run on Postgres, like production. These credentials exist only inside this CI job.
    services:
      pgsql:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: pixelforge_testing
          POSTGRES_USER: pixelforge
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pixelforge -d pixelforge_testing"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: pixelforge_testing
      DB_USERNAME: pixelforge
      DB_PASSWORD: password

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
          # sockets: Pest's browser plugin serves the app to Chromium in-process.
          extensions: pdo_pgsql, bcmath, sockets
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      # npm on Windows leaves Linux-only optional packages' dependencies out of the lock file,
      # and the deploy's `npm ci` then fails. `npm ci` here fails first.
      - name: Check the lock file installs on Linux
        run: npm ci --no-audit --no-fund

      # The browser tests (tests/Browser) drive a real Chromium through Playwright.
      - name: Install Chromium for the browser tests
        run: npx playwright install --with-deps chromium

      - name: Setup Application
        run: composer setup

      - name: Run CI Checks
        run: composer ci:check
